name: Build Meryl Car Audio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore permanent 1.41 signing key from GitHub secret
        shell: bash
        env:
          MERYL_141_KEYSTORE_BASE64: ${{ secrets.MERYL_141_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MERYL_141_KEYSTORE_BASE64" ]; then
            echo "::error::Missing MERYL_141_KEYSTORE_BASE64. No APK will be built with a new signature."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$MERYL_141_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Verify fixed 1.41 signing certificate
        shell: bash
        run: |
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="09709D467E5357C558839227131A2475628233D510F47118B5A687F2DFCD437F"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate mismatch for MerylCarPlayer 1.41. Refusing build."
            exit 1
          fi
          echo "MerylCarPlayer 1.41 certificate verified: $actual"

      - name: Normalize legacy drawable filenames before Android resource merge
        shell: bash
        run: |
          for old in "Bando haut.png" "Bando Appli_20261011_001040_0000.png"; do
            file="app/src/main/res/drawable/$old"
            if [ -f "$file" ]; then
              new="$(printf '%s' "$old" | tr '[:upper:] ' '[:lower:]_' )"
              mv "$file" "app/src/main/res/drawable/$new"
            fi
          done

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Meryl Car Audio.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MerylCarPlayer-1.41
          path: "Meryl Car Audio.apk"
          if-no-files-found: error
