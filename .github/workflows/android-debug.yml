name: Build MerylCarPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply V0.54 artist-cover interactions
        shell: bash
        run: |
          python3 scripts/apply_v054.py
          python3 - <<'PY'
          from pathlib import Path
          source_path = Path("app/src/main/java/com/nik/roadplayer/MainActivity.kt")
          text = source_path.read_text(encoding="utf-8")
          text = text.replace(r'Regex("\s+")', r'Regex("\\s+")')
          source_path.write_text(text, encoding="utf-8")
          PY
          git add app/src/main/java/com/nik/roadplayer/MainActivity.kt app/build.gradle.kts CHANGES_V0.54.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Implement V0.54 single, double and long-press gestures"
            git push origin HEAD:main
          fi

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MerylCarPlayer-V0.54-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
